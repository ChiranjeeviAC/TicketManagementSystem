<div class="page">

  <div class="header">

    <div>
      <h1>Update Ticket</h1>

      <p>
        {{ ticketNumber }}
      </p>
    </div>

    <button
      type="button"
      class="back-button"
      (click)="cancel()"
    >
      ← Back
    </button>

  </div>


  @if (loading) {

    <div class="message">
      Loading ticket...
    </div>

  }


  @if (!loading) {

    <div class="card">

      <form (ngSubmit)="updateTicket()">

        <div class="form-group">

          <label>
            Title
          </label>

          <input
            type="text"
            [(ngModel)]="title"
            name="title"
            placeholder="Enter ticket title"
          />

        </div>


        <div class="form-group">

          <label>
            Description
          </label>

          <textarea
            rows="7"
            [(ngModel)]="description"
            name="description"
            placeholder="Enter ticket description"
          ></textarea>

        </div>


        <div class="form-group">

          <label>
            Priority
          </label>

          <select
            [(ngModel)]="priority"
            name="priority"
          >

            <option value="Low">
              Low
            </option>

            <option value="Medium">
              Medium
            </option>

            <option value="High">
              High
            </option>

            <option value="Critical">
              Critical
            </option>

          </select>

        </div>


        @if (errorMessage) {

          <div class="error">
            {{ errorMessage }}
          </div>

        }


        <div class="actions">

          <button
            type="button"
            class="cancel-button"
            (click)="cancel()"
          >
            Cancel
          </button>


          <button
            type="submit"
            class="save-button"
            [disabled]="saving"
          >

            @if (saving) {
              Saving...
            } @else {
              Save Changes
            }

          </button>

        </div>

      </form>

    </div>

  }

</div>
